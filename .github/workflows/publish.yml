name: Refresh and publish KeenRoudy Sports
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '07 15 * * *'
    - cron: '37 10,16,22 * * *'
    - cron: '17 17,20 * * *'
      timezone: America/New_York
    - cron: '47 23 * * *'
      timezone: America/New_York
    - cron: '17 2 * * *'
      timezone: America/New_York
    - cron: '17 5 * * *'
      timezone: America/New_York
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: football-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check publication rules
        run: python -m unittest discover -s tests
      - name: Check browser script
        run: |
          node --check site/app.js
          node --test tests/*.test.js
      - name: Refresh schedules and record original forecasts
        run: python scripts/refresh.py
      - name: Refresh NBA and MLB scoreboards
        run: python scripts/sports_refresh.py
      - name: Check whether player history needs rebuilding
        id: history
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os, subprocess
          changed = subprocess.check_output(['git', 'diff', '--name-only', 'HEAD^', 'HEAD'], text=True).splitlines() if os.environ['EVENT_NAME'] == 'push' else []
          needed = any(p.startswith('research/') or p in ('scripts/player_history.py', 'scripts/opponent_history.py', 'site/data/research.json') for p in changed)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('needed=' + str(needed).lower() + '\n')
          PY
      - name: Refresh verified player and position history
        if: (github.event_name == 'push' && steps.history.outputs.needed == 'true') || github.event_name == 'workflow_dispatch' || github.event.schedule == '07 15 * * *'
        run: python scripts/player_history.py
      - name: Refresh followed player identities and team colors
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.schedule == '07 15 * * *'
        run: python scripts/player_identity.py
      - name: Refresh followed opponent matchup history
        if: (github.event_name == 'push' && steps.history.outputs.needed == 'true') || github.event_name == 'workflow_dispatch' || github.event.schedule == '07 15 * * *'
        run: python scripts/opponent_history.py
      - name: Refresh injury context
        run: python scripts/research_context.py
      - name: Build research review evidence
        run: node scripts/review.cjs
      - name: Preserve the public record
        run: |
          git config user.name 'football-forecast[bot]'
          git config user.email 'football-forecast[bot]@users.noreply.github.com'
          git add site/data
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh schedules, finals and pregame forecasts'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
