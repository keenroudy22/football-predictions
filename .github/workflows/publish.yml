name: Refresh and publish football board
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '37 10,16,22 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: football-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check publication rules
        run: python -m unittest discover -s tests
      - name: Check browser script
        run: node --check site/app.js
      - name: Refresh schedules and record original forecasts
        run: python scripts/refresh.py
      - name: Preserve the public record
        run: |
          git config user.name 'football-forecast[bot]'
          git config user.email 'football-forecast[bot]@users.noreply.github.com'
          git add site/data
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh schedules, finals and pregame forecasts'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
